<mat-toolbar color="primary" class="mat-elevation-z4">
  <!-- Logo y título -->
  <span class="logo">My App</span>

  <!-- Menú desplegable en pantallas pequeñas -->
  <button
    mat-icon-button
    class="menu-button"
    [matMenuTriggerFor]="shouldShowMenu ? menu : null"
    [hidden]="!shouldShowMenu"
    aria-label="Toggle menu"
    aria-haspopup="true"
    >
    <mat-icon>menu</mat-icon>
  </button>
  <mat-menu #menu="matMenu">
    <mat-list>
      @for (item of menuItems; track item) {
        <a
          mat-list-item
          [routerLink]="item.link"
          >
          {{ item.name }}
        </a>
      }
    </mat-list>
  </mat-menu>

  <!-- Menú principal en pantallas grandes -->
  <nav class="main-menu" [hidden]="shouldShowMenu">
    @for (item of menuItems; track item) {
      <a
        mat-button
        [routerLink]="item.link"
        routerLinkActive="active"
        >
        {{ item.name }}
      </a>
    }
    <a mat-button [matMenuTriggerFor]="ejemplos" >Ejemplos</a>
    <mat-menu #ejemplos="matMenu">
      @for (item of ejemplosItems; track item) {
        <a
          mat-menu-item
          [routerLink]="item.link"
          routerLinkActive="active"
          >
          {{ item.name }}
        </a>
      }
    </mat-menu>
  </nav>
</mat-toolbar>
