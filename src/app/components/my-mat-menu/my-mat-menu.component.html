<mat-sidenav-container class="container">
  <mat-sidenav #sidenav (click)="closeSidenav()" mode="side" opened>
    <mat-nav-list>
      @for (item of menuItems; track item) {
        <a mat-list-item [routerLink]="item.link">{{ item.name }}</a>
      }
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <!-- Aquí puedes colocar el contenido principal de la página -->
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
